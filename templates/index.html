<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriScans - MUAC measurement and Biometric Input</Input></title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>📏 NutriScans: Arm Measurements (MUAC)</h1>
        <p class="subtitle">Step 1: Upload upper arm photo to measure circumference. 
        </p>

        <form action="/assess" method="POST" enctype="multipart/form-data" class="data-form">

            
            <div class="photo-section">
                <div class="form-group photo-upload-group">
                    <label for="user-photo">1. Upper Arm photo (Make sure it is clearly visible):</label>
                    <input type="file" id="user-photo" name="photo" accept="image/*" required onchange="previewImage(event)">
                    <small class="instruction-text">💡 Tips: Foto must show mid-upper arm.</small>
                </div>

                <div class="image-preview-area">
                    <img id="image-preview" src="#" alt="Pratinjau Foto Lengan" style="display: none;">
                    <span id="preview-text">Photo Preview</span>
                </div>
            </div>

            <h2>Step 2: Input Biometric Data</h2>
            <div class="data-grid">
                
                <div class="form-group">
                    <label for="age">Age (Year):</label>
                    <input type="number" id="age" name="age" min="1" max="120" placeholder="Contoh: 30" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender" required>
                        <option value="" disabled selected>Choose Gender</option>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="weight">Weight (kg):</label>
                    <input type="number" id="weight" name="weight" min="1" step="0.1" placeholder="Contoh: 75.5" required>
                </div>

                <div class="form-group">
                    <label for="height">Height (cm):</label>
                    <input type="number" id="height" name="height" min="1" placeholder="Contoh: 180" required>
                </div>

            </div>

            <button type="submit" class="submit-btn">Analyze Nutrition</button>

        </form>
    </div>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('image-preview');
                const text = document.getElementById('preview-text');
                
                output.src = reader.result;
                output.style.display = 'block';
                text.style.display = 'none';
            };
            
            if (event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            } else {
                // Reset if user cancels file selection
                document.getElementById('image-preview').style.display = 'none';
                document.getElementById('preview-text').style.display = 'block';
            }
        }
    </script>

</body>
</html>
